# ProSEO Master - Admin Routes Configuration
# PrestaShop 8.x Symfony routing

# Main configuration page
proseomaster_configuration:
    path: /proseomaster/configuration
    methods: [GET, POST]
    defaults:
        _controller: 'ProSEOMaster\Controller\Admin\ProSEOMasterController::indexAction'
        _legacy_controller: AdminProSEOMaster
        _legacy_link: AdminProSEOMaster

# SEO Dashboard
proseomaster_dashboard:
    path: /proseomaster/dashboard
    methods: [GET]
    defaults:
        _controller: 'ProSEOMaster\Controller\Admin\ProSEOMasterController::dashboardAction'
        _legacy_controller: AdminProSEOMaster
        _legacy_link: AdminProSEOMaster:dashboard

# Sitemap management
proseomaster_sitemap:
    path: /proseomaster/sitemap
    methods: [GET]
    defaults:
        _controller: 'ProSEOMaster\Controller\Admin\ProSEOMasterController::sitemapAction'
        _legacy_controller: AdminProSEOMaster
        _legacy_link: AdminProSEOMaster:sitemap

# Generate sitemap (AJAX)
proseomaster_sitemap_generate:
    path: /proseomaster/sitemap/generate
    methods: [POST]
    defaults:
        _controller: 'ProSEOMaster\Controller\Admin\ProSEOMasterController::generateSitemapAction'
        _legacy_controller: AdminProSEOMaster

# Redirects management
proseomaster_redirects:
    path: /proseomaster/redirects
    methods: [GET]
    defaults:
        _controller: 'ProSEOMaster\Controller\Admin\ProSEOMasterController::redirectsAction'
        _legacy_controller: AdminProSEOMaster
        _legacy_link: AdminProSEOMaster:redirects

# Add redirect (AJAX)
proseomaster_redirect_add:
    path: /proseomaster/redirects/add
    methods: [POST]
    defaults:
        _controller: 'ProSEOMaster\Controller\Admin\ProSEOMasterController::addRedirectAction'
        _legacy_controller: AdminProSEOMaster

# Delete redirect (AJAX)
proseomaster_redirect_delete:
    path: /proseomaster/redirects/{redirectId}/delete
    methods: [POST, DELETE]
    defaults:
        _controller: 'ProSEOMaster\Controller\Admin\ProSEOMasterController::deleteRedirectAction'
        _legacy_controller: AdminProSEOMaster
    requirements:
        redirectId: \d+

# Link checker
proseomaster_link_checker:
    path: /proseomaster/link-checker
    methods: [GET]
    defaults:
        _controller: 'ProSEOMaster\Controller\Admin\ProSEOMasterController::linkCheckerAction'
        _legacy_controller: AdminProSEOMaster
        _legacy_link: AdminProSEOMaster:linkChecker

# Run link check (AJAX)
proseomaster_link_check_run:
    path: /proseomaster/link-checker/run
    methods: [POST]
    defaults:
        _controller: 'ProSEOMaster\Controller\Admin\ProSEOMasterController::runLinkCheckAction'
        _legacy_controller: AdminProSEOMaster

# Bulk editor
proseomaster_bulk_editor:
    path: /proseomaster/bulk-editor
    methods: [GET]
    defaults:
        _controller: 'ProSEOMaster\Controller\Admin\ProSEOMasterController::bulkEditorAction'
        _legacy_controller: AdminProSEOMaster
        _legacy_link: AdminProSEOMaster:bulkEditor

# Export SEO data
proseomaster_export_seo:
    path: /proseomaster/export-seo
    methods: [GET]
    defaults:
        _controller: 'ProSEOMaster\Controller\Admin\ProSEOMasterController::exportSeoDataAction'
        _legacy_controller: AdminProSEOMaster

# Schema tester
proseomaster_schema_test:
    path: /proseomaster/schema-test
    methods: [GET]
    defaults:
        _controller: 'ProSEOMaster\Controller\Admin\ProSEOMasterController::schemaTestAction'
        _legacy_controller: AdminProSEOMaster
        _legacy_link: AdminProSEOMaster:schemaTest

# Regenerate cron token (AJAX)
proseomaster_cron_token_regenerate:
    path: /proseomaster/cron-token/regenerate
    methods: [POST]
    defaults:
        _controller: 'ProSEOMaster\Controller\Admin\ProSEOMasterController::regenerateCronTokenAction'
        _legacy_controller: AdminProSEOMaster
